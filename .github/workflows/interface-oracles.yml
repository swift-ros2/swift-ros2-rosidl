name: Interface oracles

on:
  workflow_call:
    inputs:
      corpus-product:
        description: Executable that writes the oracle corpus (e.g. CommonInterfacesOracleCorpus)
        required: true
        type: string
      rosidl-path:
        description: Path to a swift-ros2-rosidl checkout holding Scripts/cdr-oracle.py
        required: false
        type: string
        default: .build/checkouts/swift-ros2-rosidl
      apt-packages:
        description: >-
          Extra Debian packages installed into osrf/ros:<distro>-desktop before the oracles run,
          space-separated; ${distro} is replaced with the row's distribution
          (e.g. "ros-${distro}-moveit-msgs ros-${distro}-control-msgs"); the image's packages
          are upgraded to the same sync.
        required: false
        type: string
        default: ''

jobs:
  oracles:
    name: Oracles (${{ matrix.ros_distro }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Jazzy and Lyrical run on every event and gate pull requests. Kilted and Rolling join
        # only the caller's weekly schedule run and never fail it.
        ros_distro: ${{ fromJSON(github.event_name == 'schedule' && '["jazzy", "lyrical", "kilted", "rolling"]' || '["jazzy", "lyrical"]') }}
    continue-on-error: ${{ matrix.ros_distro == 'kilted' || matrix.ros_distro == 'rolling' }}
    env:
      IMAGE: swift-ros2-interface-oracle:${{ matrix.ros_distro }}
    steps:
      - uses: actions/checkout@v4
      # Same steps as the install-swift-linux composite action of the calling
      # repositories, inlined because a local action path resolves in the
      # caller's checkout, which this reusable workflow cannot rely on. The key
      # and the path match that action, so the repository's build-linux job and
      # this one share one cached tarball.
      - name: Restore the Swift toolchain tarball
        id: swift-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/swift-toolchain
          key: v1-swift-toolchain-ubuntu24.04-${{ runner.arch }}-6.3.1
      - name: Download and verify the Swift toolchain tarball
        if: steps.swift-cache.outputs.cache-hit != 'true'
        env:
          TARBALL_DIR: ${{ runner.temp }}/swift-toolchain
          VERIFY_DIR: ${{ runner.temp }}/swift-toolchain-verify
        run: |
          set -euo pipefail
          file=swift-6.3.1-RELEASE-ubuntu24.04.tar.gz
          url="https://download.swift.org/swift-6.3.1-release/ubuntu2404/swift-6.3.1-RELEASE/$file"
          mkdir -p "$TARBALL_DIR" "$VERIFY_DIR"
          # swift.org resets connections now and then; retry every error, not only the transient ones curl knows.
          curl_retry=(-fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30)
          curl "${curl_retry[@]}" -o "$TARBALL_DIR/$file" "$url"
          curl "${curl_retry[@]}" -o "$VERIFY_DIR/$file.sig" "$url.sig"
          curl "${curl_retry[@]}" --compressed -o "$VERIFY_DIR/all-keys.asc" https://www.swift.org/keys/all-keys.asc
          # Only a tarball that matches its swift.org signature reaches the cache.
          export GNUPGHOME="$VERIFY_DIR/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --quiet --import "$VERIFY_DIR/all-keys.asc"
          gpg --batch --verify "$VERIFY_DIR/$file.sig" "$TARBALL_DIR/$file"
      - name: Save the Swift toolchain tarball
        if: steps.swift-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/swift-toolchain
          key: v1-swift-toolchain-ubuntu24.04-${{ runner.arch }}-6.3.1
      - name: Install Swift 6.3.1
        run: |
          sudo mkdir -p /opt/swift
          sudo tar -xzf "${{ runner.temp }}/swift-toolchain/swift-6.3.1-RELEASE-ubuntu24.04.tar.gz" -C /opt/swift --strip-components=1
          echo "/opt/swift/usr/bin" >> "$GITHUB_PATH"
      - name: Fetch the upstream IDL pinned in idl.lock
        run: bash Scripts/fetch-idl.sh
      - name: Oracle image
        env:
          DISTRO: ${{ matrix.ros_distro }}
          APT_PACKAGES: ${{ inputs.apt-packages }}
        run: |
          base="osrf/ros:${DISTRO}-desktop"
          # The image is 1+ GB; retry the pull if the registry drops it.
          for attempt in 1 2 3; do docker pull "$base" && break; [ "$attempt" -lt 3 ] || exit 1; sleep 10; done
          pkgs=$(printf '%s' "$APT_PACKAGES" | sed "s/\${distro}/${DISTRO}/g")
          if [ -n "$pkgs" ]; then
            # Packages from the current sync can need newer core libraries than the published
            # image has (Lyrical 2026-10: control_msgs' type support needed a newer
            # service_msgs), so bring the image to the same sync as the packages.
            printf 'FROM %s\nENV DEBIAN_FRONTEND=noninteractive\nRUN apt-get -o Acquire::Retries=5 update && apt-get -o Acquire::Retries=5 install -y --no-install-recommends %s && apt-get -o Acquire::Retries=5 upgrade -y && rm -rf /var/lib/apt/lists/*\n' \
              "$base" "$pkgs" | docker build -t "$IMAGE" -
          else
            docker tag "$base" "$IMAGE"
          fi
      - name: Hash oracle
        run: |
          # Every generated distribution, as Scripts/regenerate.sh reads them, so the hashes
          # checked are those the merged generated types carry. --distros picks the row; the
          # Rolling row, with no Rolling IDL, checks the hashes generated types use on Rolling
          # (the newest generated distribution's shape) against /opt/ros/rolling.
          ARGS=()
          while IFS= read -r line; do ARGS+=("$line"); done < <(bash Scripts/generator-args.sh)
          swift run swift-ros2-gen "${ARGS[@]}" --verify-hashes "$IMAGE" --distros "${{ matrix.ros_distro }}" --diagnose
      - name: CDR oracle
        run: |
          # Only the samples of the types this distribution has, encoded with its message
          # schemas: the oracle image fails on a type its distribution lacks, and on a field
          # its distribution lacks or misses.
          swift run "${{ inputs.corpus-product }}" "$PWD/oracle-corpus" "${{ matrix.ros_distro }}"
          docker run --rm -v "$PWD/oracle-corpus:/corpus:ro" \
            -v "$PWD/${{ inputs.rosidl-path }}/Scripts/cdr-oracle.py:/cdr-oracle.py:ro" \
            "$IMAGE" bash -c "source /opt/ros/${{ matrix.ros_distro }}/setup.bash && python3 /cdr-oracle.py /corpus"
